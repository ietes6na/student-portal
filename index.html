<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Студенческий портал</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Шапка сайта -->
    <header>
        <div class="container">
            <h1>🎓 Студенческий Портал</h1>
            <nav>
                <ul>
                    <li><a href="#" onclick="showSection('home')">Главная</a></li>
                    <li><a href="#" onclick="showSection('schedule')">Расписание</a></li>
                    <!-- Ссылки на другие разделы (заглушки для других участников) -->
                    <li><a href="#" onclick="alert('Раздел в разработке: Новости')">Новости</a></li>
                    <li><a href="#" onclick="alert('Раздел в разработке: Контакты')">Контакты</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Основной контент -->
    <main class="container">
        
        <!-- Секция: Главная -->
        <section id="home-section">
            <h2>Добро пожаловать!</h2>
            <p>Выберите раздел в меню выше, чтобы узнать расписание занятий или прочитать новости.</p>
        </section>

        <!-- Секция: Расписание (Задача Участника 1) -->
        <section id="schedule-section" style="display: none;">
            <h2>📅 Расписание занятий</h2>
            
            <!-- Фильтр по дням недели -->
            <div class="schedule-controls">
                <label for="day-select">Выберите день:</label>
                <select id="day-select" onchange="renderSchedule()">
                    <option value="all">Все дни</option>
                    <option value="Понедельник">Понедельник</option>
                    <option value="Вторник">Вторник</option>
                    <option value="Среда">Среда</option>
                    <option value="Четверг">Четверг</option>
                    <option value="Пятница">Пятница</option>
                </select>
            </div>

            <!-- Таблица расписания -->
            <div class="table-responsive">
                <table id="schedule-table">
                    <thead>
                        <tr>
                            <th>День</th>
                            <th>Время</th>
                            <th>Предмет</th>
                            <th>Аудитория</th>
                            <th>Преподаватель</th>
                        </tr>
                    </thead>
                    <tbody id="schedule-body">
                        <!-- Сюда JS будет вставлять строки -->
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 Студенческий Портал. Групповой проект.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
